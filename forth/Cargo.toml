[package]
name = "fourth"
version = "0.0.0"
edition = "2024"
publish = false
# `4th.rs` is the only cargo target here; keep auto-discovery away from `src/`.
autobins = false
autolib = false
autotests = false
autoexamples = false
autobenches = false

[features]
# Re-entrant entry points for the browser demo instead of a `main` reading stdin.
web = []

[[bin]]
name = "4th"
path = "4th.rs"

[profile.release]
opt-level = "s"
