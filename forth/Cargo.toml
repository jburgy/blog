[package]
name = "fourth"
version = "0.0.0"
edition = "2024"
publish = false
# Keep auto-discovery away from `src/`; the two standalone interpreters are
# declared explicitly below.
autobins = false
autolib = false
autotests = false
autoexamples = false
autobenches = false

[features]
# Re-entrant entry points for the browser demo instead of a `main` reading stdin.
web = []
# jansforth uses Unix file-descriptor APIs and is not a WASI browser target.
jansforth = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "4th"
path = "4th.rs"

[[bin]]
name = "jansforth"
path = "jansforth.rs"
required-features = ["jansforth"]

[profile.release]
opt-level = "s"
