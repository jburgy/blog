[build-system]
requires = ["meson-python", "ninja", "numpy", "ziglang"]
build-backend = "mesonpy"

[project]
name = "blog"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "puzzlekit>=0.1.0",
]

[dependency-groups]
dev = [
    "ampl-module-base>=20250901",
    "ampl-module-highs>=20251015",
    "amplpy>=0.15.2",
    "interpreters-pep-734",
    "jupyter>=1.1.1",
    "matplotlib",
    "meson",
    "meson-python",
    "ninja",
    "pandas",
    "pandas-stubs>=3.0.0.260204",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-github-report",
    "scipy",
    "scipy-stubs>=1.17.1.4",
    "sqlalchemy",
    "sympy",
    "ziglang",
]

[tool.meson-python.args]
compile = ["-j4"]

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "--ignore=aoc2024", "--ignore=progress"]

[tool.coverage.report]
exclude_also = [
    # A "# pragma: exclude file" comment opts a whole module out of
    # coverage, instead of listing it in [tool.coverage.run] omit below.
    '\A(?s:.*# pragma: exclude file.*)\Z',
]

[tool.coverage.run]
omit = [
    "aoc2024/*",
    "progress/*",
    "forth/jansforth.py",
]

[tool.uv]
# Editable meson-python rebuilds need ninja from .venv, not a transient isolated build env.
no-build-isolation-package = ["blog"]

[[tool.uv.index]]
url = "https://pypi.ampl.com/"

[tool.uv.sources]
puzzlekit = { git = "https://github.com/jburgy/puzzlekit.git", branch = "main" }

[tool.ruff]
exclude = [
    ".venv",
    "emsdk-cache",
]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = [
    "emsdk-cache",
    "**/*.ipynb",
]
