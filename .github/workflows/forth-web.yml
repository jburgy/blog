name: forth-web

on:
  push:
    paths:
      - "forth/4th.rs"
      - "forth/4th.32.fs"
      - "forth/web/**"
      - "forth/Cargo.toml"
      - "forth/Makefile"
      - ".github/workflows/forth-web.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forth
    steps:
      - uses: actions/checkout@v4

      # `become` needs nightly; the wasm tail-call and WASI bits are all in
      # rustflags, so no extra tooling and no browser download.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forth

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund

      - run: make web
      - run: npx vitest run web/
