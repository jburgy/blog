name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      # every C build in the repo (meson, forth/Makefile, regexp tests) honors $CC
      CC: clang
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13, 3.14]

    steps:
      - uses: actions/checkout@v7
        with:
          # regexp/test_regexp.py builds jonesforth.S from the submodule
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # v7 defaults to true, which discards the downloaded wheel cache
          # (ziglang is 93MiB) before saving, forcing a re-download every run
          prune-cache: false
          python-version: ${{ matrix.python-version }}
      # progress/ (zig build, ~1 min) is not needed by any test, and neither is
      # the 93MB ziglang wheel: no test shells out to zig
      - run: uv sync --no-install-package ziglang -C setup-args=-Dprogress=false
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"
      - run: uvx ruff check
      - run: uvx ty check --python .venv
      # clang's -m32 still takes its 32-bit libgcc and headers from gcc-multilib;
      # llvm only adds the unversioned llvm-readobj that copypatch/gen.py runs
      - run: sudo apt-get install -y --no-install-recommends gcc-multilib llvm
      # a re-sync would drop -Dprogress=false
      - run: uv run --no-sync pytest --cov --cov-report=xml
        env:
          pytest_github_report: true
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # pin the upload target explicitly: CODECOV_TOKEN has previously been
          # scoped to the wrong repo (jburgy/jburgy) on codecov.io, silently
          # uploading coverage there instead of here
          slug: jburgy/blog
