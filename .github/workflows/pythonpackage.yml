name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13, 3.14]

    steps:
      - uses: actions/checkout@v4
        with:
          # regexp/test_regexp.py builds jonesforth.S from the submodule
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # progress/ (zig build, ~1 min) is not needed by any test
      - run: uv sync -C setup-args=-Dprogress=false
      - uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
      - run: uvx ruff check
      - run: uvx ty check --python .venv
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      # a re-sync would drop -Dprogress=false
      - run: uv run --no-sync pytest --cov --cov-report=xml
        env:
          pytest_github_report: true
      # Codecov rejects tokenless uploads until the repo is activated on
      # codecov.io with a CODECOV_TOKEN secret; continue-on-error keeps that
      # failure from blocking the build while still showing up in the UI
      - uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
