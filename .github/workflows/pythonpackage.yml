name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13, 3.14]

    steps:
      - uses: actions/checkout@v4
        with:
          # regexp/test_regexp.py builds jonesforth.S from the submodule
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # progress/ is built with `zig build`; a cold zig cache costs ~1 min
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global
            ${{ runner.temp }}/zig-local
          key: zig-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'progress/*.zig', 'progress/build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-py${{ matrix.python-version }}-
      - run: uv sync
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local
      - uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
      - run: uvx ruff check
      - run: uvx ty check --python .venv
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - run: uv run pytest
        env:
          pytest_github_report: true
