name: JavaScript

# `push` only, matching the Python workflow: adding `pull_request` as well runs
# the whole thing twice on every PR branch. No path filter (unlike before):
# Codecov's `after_n_builds: 5` in codecov.yml expects all 5 uploads (this
# workflow's 3 jobs plus pythonpackage.yml's 2) on every commit, so forth/
# regexp/fourt2py now build and upload coverage even when untouched.
on: [push]

jobs:
  forth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forth
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('forth/package-lock.json') }}
      - run: npm ci

      # Both wasm binaries have to exist before vitest starts: 5th.wasm from
      # clang, and 4th.wasm from nightly rust, which `become` requires.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test
      - uses: bytecodealliance/setup-wasi-sdk-action@main
      - uses: pyodide/setup-emsdk@v15
        with:
          version: 4.0.15
          actions-cache-folder: 'emsdk-cache'
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forth
      - run: make web

      - run: npm run test

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # see pythonpackage.yml for why the slug is pinned explicitly
          slug: jburgy/blog
          directory: forth/coverage
          flags: forth

  regexp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regexp/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Restore before `npm ci`, whose postinstall is what fetches Chrome.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('regexp/web/package-lock.json') }}
      - run: npm ci

      # The runner's kernel blocks Chrome's sandbox, and every page under test
      # is a local file.
      - run: npm test -- -a no-sandbox

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jburgy/blog
          directory: regexp/web/coverage
          flags: regexp-web

  fourt2py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fourt2py
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pyodide/setup-emsdk@v15
        with:
          version: 4.0.15
          actions-cache-folder: 'emsdk-cache'
      - run: npm ci

      # npm test builds wasm/fourt.mjs from wasm/fourt.c (a transliteration of
      # FOURT.F) before running vitest.
      - run: npm test

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jburgy/blog
          directory: fourt2py/coverage
          flags: fourt2py
