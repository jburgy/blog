name: JavaScript

# `push` only, matching the Python workflow: adding `pull_request` as well runs
# the whole thing twice on every PR branch. No path filter (unlike before):
# Codecov's `after_n_builds: 5` in codecov.yml expects all 5 uploads (this
# workflow's 3 uploading jobs plus pythonpackage.yml's 2) on every commit, so forth/
# regexp/fourt2py now build and upload coverage even when untouched.
on: [push]

jobs:
  forth:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: forth
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('forth/package-lock.json') }}
      - run: npm ci

      # Both wasm binaries have to exist before vitest starts: 5th.wasm from
      # clang, and 4th.wasm from nightly rust, which `become` requires.
      #
      # A `zig` shim backed by the ziglang PyPI package (same one
      # assets/Makefile's uvx/python-zig already uses), not setup-zig (whose
      # node20 runtime GitHub now warns about): package.json's
      # build:6th:wasi and wasi-command.test.ts both spawn a bare `zig`.
      - uses: astral-sh/setup-uv@v7
        with:
          # v7 defaults prune-cache to true, which discards the downloaded
          # wheel cache (ziglang is 93MiB) before saving, forcing a
          # re-download every run
          prune-cache: false
      - run: |
          printf '#!/bin/sh\nexec uvx --from ziglang==0.17.0 python-zig "$@"\n' > "$RUNNER_TEMP/zig"
          chmod +x "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # `.use_llvm = true` (build.zig) makes every `zig build test` run pay
      # LLVM's codegen cost from scratch -- stage2_x86_64 still can't do the
      # guaranteed tail calls 6th.zig's dispatch loop relies on, so it isn't
      # optional. Caching both of zig's caches turns that cost into a no-op
      # whenever forth/*.zig is unchanged, which is most pushes since this
      # job has no path filter (see top-of-file comment).
      - uses: actions/cache@v6
        with:
          path: |
            forth/.zig-cache
            ~/.cache/zig
          key: zig-cache-${{ hashFiles('forth/*.zig') }}
          restore-keys: zig-cache-
      - run: zig build test
      - uses: bytecodealliance/setup-wasi-sdk-action@main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forth
      - run: make web

      - run: npm run test

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # see pythonpackage.yml for why the slug is pinned explicitly
          slug: jburgy/blog
          directory: forth/coverage
          flags: forth

  assemblyscript:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [lisp, TinyBasic]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      # 24: wasi-command.mjs needs JSPI, which vitest enables with
      # --experimental-wasm-jspi (see forth/vitest.config.mts).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci

      # `npm test` builds the wasi target first (asc is fetched by npx, not a
      # dependency), then runs vitest. No Codecov upload, unlike the jobs
      # above: after_n_builds in codecov.yml counts exactly 5 uploads.
      - run: npm test

  regexp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: regexp/web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Restore before `npm ci`, whose postinstall is what fetches Chrome.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('regexp/web/package-lock.json') }}
      - run: npm ci

      # The runner's kernel blocks Chrome's sandbox, and every page under test
      # is a local file.
      - run: npm test -- -a no-sandbox

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jburgy/blog
          directory: regexp/web/coverage
          flags: regexp-web

  fourt2py:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fourt2py
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci

      # wasm/fourt.wasm (built from wasm/fourt.c by `npm run build:wasm`) is an
      # optional, manual-only comparison build -- see web/test/fourt.test.mjs
      # and web/benchmark.mjs. The published demo only uses fourt.pow2.mjs
      # (plain JS), so default `npm test` needs no wasi-sdk.
      - run: npm test

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jburgy/blog
          directory: fourt2py/coverage
          flags: fourt2py
