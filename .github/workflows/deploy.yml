name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: bytecodealliance/setup-wasi-sdk-action@v1.0.0
        with:
          version: '34'
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            forth
            slip
      # `zig build install-6th` (6th-wasi.wasm) pays LLVM codegen from scratch (~90s) otherwise.
      # Own key prefix, not javascript.yml's: whichever workflow saved first won the shared key,
      # and a hit never re-saves, so this job never got the wasi artifacts cached.
      - uses: actions/cache@v6
        with:
          path: |
            forth/.zig-cache
            ~/.cache/zig
          key: zig-cache-wasi-${{ hashFiles('forth/*.zig') }}
          restore-keys: zig-cache-wasi-
      - run: make --jobs=4
      - uses: actions/upload-pages-artifact@v5
        with:
          path: assets

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        
