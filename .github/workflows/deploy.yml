name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: bytecodealliance/setup-wasi-sdk-action@main
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            forth
            slip
      # Same key as javascript.yml: `zig build` (6th-wasi.wasm) pays LLVM codegen from scratch otherwise
      - uses: actions/cache@v6
        with:
          path: |
            forth/.zig-cache
            ~/.cache/zig
          key: zig-cache-${{ hashFiles('forth/*.zig') }}
          restore-keys: zig-cache-
      - run: make --jobs=4
      - uses: actions/upload-pages-artifact@v5
        with:
          path: assets

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        
